name: ZITERA_LAB CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-check:
    name: Rust Engine CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Check
        run: |
          cd engine/rust
          cargo check --verbose

      - name: Cargo Clippy
        run: |
          cd engine/rust
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Build Release
        run: |
          cd engine/rust
          cargo build --release --verbose

  ui-check:
    name: Tauri Desktop CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd ui/tauri
          npm ci

      - name: Lint
        run: |
          cd ui/tauri
          npm run lint

      - name: Build
        run: |
          cd ui/tauri
          npm run build
