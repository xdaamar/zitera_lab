name: zitera_lab
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets — all images bundled for offline-first
  assets:
    - assets/images/sidebar_bg.jpg
    - assets/images/zeta_avatar.png
    - assets/images/calico_cat.png
    - assets/images/sticker_blonde.png
    - assets/images/sticker_pink.png
    - assets/images/sticker_purple.png
    - assets/images/sticker_cat_laptop.png
    - assets/images/mascot_girl.jpg
    - assets/images/mascot_cat.jpg
    - assets/images/pixel_logo.jpg

  # Offline Fonts — retro pixel aesthetic, no CDN required
  fonts:
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
