name: zitera_lab
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets — all images bundled for offline-first
  assets:
    - assets/images/sidebar_bg.webp
    - assets/images/sidebar_bg.jpg
    - assets/images/bg_dashboard.jpg
    - assets/images/bg_labs.jpg
    - assets/images/bg_environment.jpg
    - assets/images/bg_tools.jpg
    - assets/images/bg_settings.jpg
    - assets/images/zeta_avatar.png
    - assets/images/calico_cat.png
    - assets/images/sticker_blonde.png
    - assets/images/sticker_pink.png
    - assets/images/sticker_purple.png
    - assets/images/sticker_cat_laptop.png
    - assets/images/sticker_bunny.png
    - assets/images/sticker_shiba.png
    - assets/images/sticker_hamster.png
    - assets/images/sticker_duck.png
    - assets/images/zitera_logo.png

  # Offline Fonts — high-tech retro & developer typography
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

