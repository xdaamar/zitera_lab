<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .bg { fill: #0a0d12; }
      .grid-line { stroke: #1a2332; stroke-width: 1; stroke-dasharray: 4,4; }
      .border-line { stroke: #2a3547; stroke-width: 1.5; }
      .accent-red { fill: #e63946; }
      .accent-stroke { stroke: #e63946; stroke-width: 2; }
      .wordmark { font-family: 'JetBrains Mono', monospace; font-size: 58px; font-weight: 900; letter-spacing: 6px; fill: #f1f5f9; }
      .glitch-sub { font-family: 'JetBrains Mono', monospace; font-size: 58px; font-weight: 900; letter-spacing: 6px; fill: #00e5ff; opacity: 0.25; }
      .subtext { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #64748b; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; fill: #e63946; }
      .badge-bg { fill: rgba(230, 57, 70, 0.12); stroke: #e63946; stroke-width: 1; }
      .status-dot { fill: #10b981; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" rx="12" class="bg"/>
  
  <!-- Technical Grid -->
  <line x1="20" y1="40" x2="700" y2="40" class="grid-line"/>
  <line x1="20" y1="140" x2="700" y2="140" class="grid-line"/>
  <line x1="160" y1="20" x2="160" y2="160" class="grid-line"/>
  <line x1="560" y1="20" x2="560" y2="160" class="grid-line"/>

  <!-- Technical Corner Brackets -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" class="border-line"/>
  <path d="M 696 36 L 696 24 L 684 24" fill="none" class="border-line"/>
  <path d="M 24 144 L 24 156 L 36 156" fill="none" class="border-line"/>
  <path d="M 696 144 L 696 156 L 684 156" fill="none" class="border-line"/>

  <!-- Top Metadata Bar -->
  <rect x="44" y="22" width="135" height="18" rx="3" class="badge-bg"/>
  <text x="52" y="34" class="badge-text">SYS.ID // SEC-LAB</text>

  <circle cx="660" cy="30" r="4" class="status-dot"/>
  <text x="610" y="34" class="subtext" font-size="10">LOCAL.0x1</text>

  <!-- Wordmark Shadow/Glitch layer -->
  <text x="46" y="104" class="glitch-sub">ZITERA_LAB</text>

  <!-- Main Wordmark -->
  <text x="44" y="102" class="wordmark">ZITERA<tspan fill="#e63946">_</tspan><tspan fill="#cbd5e1">LAB</tspan></text>

  <!-- Subtitle / Spec details -->
  <text x="46" y="132" class="subtext">PERSONAL CYBER SECURITY LABORATORY</text>
  <text x="560" y="132" class="subtext" font-size="11" fill="#475569">V1.0 // OWASP-25</text>

  <!-- Technical Hatch marks -->
  <line x1="480" y1="68" x2="495" y2="68" stroke="#334155" stroke-width="3"/>
  <line x1="500" y1="68" x2="515" y2="68" stroke="#334155" stroke-width="3"/>
  <line x1="520" y1="68" x2="535" y2="68" stroke="#334155" stroke-width="3"/>
  <line x1="540" y1="68" x2="555" y2="68" stroke="#e63946" stroke-width="3"/>
</svg>
