<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180">
  <defs>
    <style>
      .bg-l { fill: #f8fafc; }
      .grid-line-l { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
      .border-line-l { stroke: #cbd5e1; stroke-width: 1.5; }
      .wordmark-l { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 58px; font-weight: 900; letter-spacing: 6px; fill: #0f172a; }
      .subtext-l { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #64748b; }
      .badge-text-l { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; fill: #dc2626; }
      .badge-bg-l { fill: rgba(220, 38, 38, 0.08); stroke: #dc2626; stroke-width: 1; }
      .status-dot-l { fill: #059669; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" rx="12" class="bg-l"/>
  
  <!-- Technical Grid -->
  <line x1="20" y1="40" x2="700" y2="40" class="grid-line-l"/>
  <line x1="20" y1="140" x2="700" y2="140" class="grid-line-l"/>
  <line x1="160" y1="20" x2="160" y2="160" class="grid-line-l"/>
  <line x1="560" y1="20" x2="560" y2="160" class="grid-line-l"/>

  <!-- Technical Corner Brackets -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" class="border-line-l"/>
  <path d="M 696 36 L 696 24 L 684 24" fill="none" class="border-line-l"/>
  <path d="M 24 144 L 24 156 L 36 156" fill="none" class="border-line-l"/>
  <path d="M 696 144 L 696 156 L 684 156" fill="none" class="border-line-l"/>

  <!-- Top Metadata Bar -->
  <rect x="44" y="22" width="135" height="18" rx="3" class="badge-bg-l"/>
  <text x="52" y="34" class="badge-text-l">SYS.ID // SEC-LAB</text>

  <circle cx="660" cy="30" r="4" class="status-dot-l"/>
  <text x="610" y="34" class="subtext-l" font-size="10">LOCAL.0x1</text>

  <!-- Main Wordmark -->
  <text x="44" y="102" class="wordmark-l">ZITERA<tspan fill="#dc2626">_</tspan><tspan fill="#334155">LAB</tspan></text>

  <!-- Subtitle / Spec details -->
  <text x="46" y="132" class="subtext-l">PERSONAL CYBER SECURITY LABORATORY</text>
  <text x="560" y="132" class="subtext-l" font-size="11" fill="#94a3b8">V1.0 // OWASP-25</text>

  <!-- Technical Hatch marks -->
  <line x1="480" y1="68" x2="495" y2="68" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="500" y1="68" x2="515" y2="68" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="520" y1="68" x2="535" y2="68" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="540" y1="68" x2="555" y2="68" stroke="#dc2626" stroke-width="3"/>
</svg>
